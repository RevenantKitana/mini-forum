
  <!DOCTYPE html>
  <html lang="vi">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
      <meta name="description" content="Mini Forum - Diễn đàn thảo luận" />
      <title>Mini Forum</title>
      
      <!-- Google Fonts: Plus Jakarta Sans & Inter for optimal Vietnamese typography -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400;1,14..32,600&display=swap" rel="stylesheet">
      
      <!-- Early font size initialization to prevent flashing before React renders -->
      <script>
        (function() {
          const SCALE_VALUES = {
            'xs': 0.88,
            'sm': 0.94,
            'md': 1.0,
            'lg': 1.08,
            'xl': 1.18
          };
          
          const initialScale = localStorage.getItem('forum_font_size_scale') || 'md';
          const scaleValue = SCALE_VALUES[initialScale] || 1;
          
          document.documentElement.style.setProperty('--font-size-scale', String(scaleValue));
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
